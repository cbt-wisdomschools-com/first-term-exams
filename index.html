        }

         .main {
          width: 405px;

          background: #eee;
          overflow: hidden;
          border-radius: 25px;
          box-shadow: 5px 20px 50px #000;
          text-align: center;
        }
        .login-container {
            background-color: rgba(200,200,200,0.4);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }
       
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
       
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
       
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
       
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
       
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s;
        }
       
        input:focus {
            border-color: #2575fc;
            outline: none;
        }
       
        .login-btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
       
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
       
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
       
        .demo-accounts {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: left;
        }
       
        .demo-accounts h3 {
            color: #555;
            margin-bottom: 10px;
            font-size: 16px;
        }
       
        .demo-accounts p {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

           .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: rgb(150,125,150);
            padding: 10px 0;
        }
    
        /* Moving text animation */
        .marquee-text {
            display: inline-block;
            color: gold;
            font-size: 24px;
            font-weight: bold;
            animation: marquee 10s linear infinite;
        }

        /* Keyframes for moving text */
        @keyframes marquee {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(-100%);
            }
        }

         // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
           
            const username = document.getElementById('username').value.toLowerCase().trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const altCheck = document.getElementById('altLoginCheck');
           
            // Check if credentials match any user (case-insensitive username match)
            const matchedUser = users.find(user =>
                user.username.toLowerCase() === username && user.password === password
            );
          if (matchedUser) {
                // Check if user has paid
                if (matchedUser.paid === false) {
                    alert("⚠️ You have not paid your school fees. You are not allowed access to the report portal.\n\nPlease contact the school administration to regularize your payment.");
                    window.location.href = 'Debtors.html';
                    //return; // Stop execution, don't redirect
                }
       
         
                            
                // User has paid, proceed with login
                // Store user data in sessionStorage for the main page to use
                sessionStorage.setItem('loggedInUser', JSON.stringify(matchedUser));
                sessionStorage.setItem('username', matchedUser.username);
                sessionStorage.setItem('image', `img/${matchedUser.image}`); // Add img/ prefix
                
                console.log("✅ Login successful for paid user:", matchedUser.username);
                
                // Check if alt login checkbox is checked
                if (altCheck.checked) {
                    console.log("🔄 Running alternate validation...");
                    validateLoginComparison(username, password);
                } else {
                    // Redirect to the main page
                    window.location.href = 'final_instruction.html';
                }
            } else {
                // Show error message
                errorMessage.style.display = 'block';
               
                // Clear password field
                document.getElementById('password').value = '';
            }
        });

        // =============================
        // SECOND LOGIN METHOD (for comparison)
        // =============================
        function validateLoginComparison(username, password) {
            if (!username || !password) {
                alert("Please enter both username and password.");
                return;
            }

            const user = users.find(
                (u) => u.username.toLowerCase() === username.toLowerCase() && u.password === password
            );

            if (user) {
                // Check if user has paid
                if (user.paid === false) {
                    alert("⚠️ You have not paid your school fees. You are not allowed access to the report portal.\n\nPlease contact the school administration to regularize your payment.");
                       window.location.href = "Debtors.html";
                    return;
                }
                
                // Store again to ensure both formats are available
                sessionStorage.setItem('username', user.username);
                sessionStorage.setItem('image', `img/${user.image}`); // Add img/ prefix
                console.log("✅ Alternate validation passed for paid user");
                window.location.href = 'final_instruction.html';
            } else {
