    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Jost', sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            background-image: url("img/computerlab1.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .login-container {
            background-color: rgba(200, 200, 200, 0.55);
            border-radius: 25px;
            box-shadow: 5px 20px 50px #000;
            width: 100%;
            max-width: 420px;
            padding: 30px 35px 35px;
            text-align: center;
        }

        /* Logo wrapper keeps image centered and responsive */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-wrapper img {
            display: block;
            width: 100%;
            max-width: 320px;
            height: auto;
            max-height: 110px;
            object-fit: contain;
        }

        /* Marquee now sits neatly inside the container */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: gray;
            border-radius: 6px;
            padding: 8px 0;
            margin-bottom: 15px;
        }

        .marquee-text {
            display: inline-block;
            color: red;
            font-size: 16px;
            font-weight: bold;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-100%); }
        }

        /* Pause on hover for readability */
        .marquee-container:hover .marquee-text {
            animation-play-state: paused;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: lime;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2575fc;
            outline: none;
        }

        .login-btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .footer-label {
            display: block;
            color: lime;
            font-size: 18px;
            margin-top: 15px;
        }

        .home-link {
            display: inline-block;
            margin-top: 10px;
            color: red;
            font-size: 18px;
            text-decoration: none;
        }

        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body oncontextmenu="return false;">

            </div>

            <div class="input-group">
                <label for="password" style="color: orange; font-size: 18px; text-align: center;">
                    Enter Your Password Here
                </label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div style="margin-top: 10px;">

            </div>

            <button type="submit" class="login-btn">Sign In</button>

            <div class="error-message" id="errorMessage">

            </div>

            <label class="footer-label">WISFOS CBT PORTAL...</label>
            <a href="https://cbt-wisdomschools-com.github.io/home/" class="home-link">Home</a>
        </form>

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const altCheck = document.getElementById('altLoginCheck');

                user.username.toLowerCase() === username && user.password === password
            );

                    console.log("🔄 Running alternate validation...");
                    validateLoginComparison(username, password);
                } else {
                    window.location.href = 'final_instruction.html';
                }
            } else {
                errorMessage.style.display = 'block';

            }

        function validateLoginComparison(username, password) {
            if (!username || !password) {
                alert("Please enter both username and password.");
                return;
            }

            const user = users.find(
                (u) => u.username.toLowerCase() === username.toLowerCase() && u.password === password
            );

            if (user) {
                if (user.paid === false) {
                    alert("⚠️ You have not paid your school fees. You are not allowed access to the report portal.\n\nPlease contact the school administration to regularize your payment.");
                    window.location.href = "Debtors.html";
                    return;
                }

                sessionStorage.setItem('username', user.username);
                sessionStorage.setItem('image', `img/${user.image}`);
                console.log("✅ Alternate validation passed for paid user");
                window.location.href = 'final_instruction.html';
            } else {
                alert("Invalid username or password in alternate check.");
            }
